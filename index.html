<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gourmet Gateway</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #4facfe, #00f2fe);
  color: white;
}

h1 {
  text-align: center;
}

.menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  padding: 20px;
}

.card {
  background: rgba(0,0,0,0.4);
  padding: 15px;
  border-radius: 15px;
  width: 180px;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 8px 15px;
  border: none;
  border-radius: 8px;
  background: white;
  color: black;
  cursor: pointer;
}

.cart-box {
  background: black;
  padding: 10px;
}

.payment {
  display: none;
  text-align: center;
  padding: 20px;
}

input {
  padding: 8px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}
</style>
</head>

<body>

<h1>🍔 Gourmet Gateway</h1>

<div id="menuPage">
  <div class="menu">
    <div class="card">
      <h3>Pizza - ₹150</h3>
      <button onclick="addItem('Pizza',150)">Add</button>
    </div>

    <div class="card">
      <h3>Burger - ₹100</h3>
      <button onclick="addItem('Burger',100)">Add</button>
    </div>

    <div class="card">
      <h3>Biryani - ₹200</h3>
      <button onclick="addItem('Biryani',200)">Add</button>
    </div>
  </div>

  <div class="cart-box">
    <h3>🛒 Cart</h3>
    <ul id="cartList"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="goToPayment()">Proceed to Payment</button>
  </div>
</div>

<div id="paymentPage" class="payment">
  <h2>💳 Payment</h2>

  <input type="text" placeholder="Name"><br>
  <input type="text" placeholder="Card Number"><br>
  <input type="text" placeholder="UPI ID"><br>

  <h3>Total: ₹<span id="payTotal">0</span></h3>

  <button onclick="placeOrder()">Pay Now</button>
</div>

<script>
let total = 0;

function addItem(name, price) {
  const list = document.getElementById("cartList");

  const li = document.createElement("li");
  li.innerHTML = name + " - ₹" + price;

  list.appendChild(li);

  total += price;
  document.getElementById("total").innerText = total;
}

function goToPayment() {
  document.getElementById("menuPage").style.display = "none";
  document.getElementById("paymentPage").style.display = "block";
  document.getElementById("payTotal").innerText = total;
}

function placeOrder() {
  alert("🎉 Order Placed Successfully!");
  location.reload();
}
</script>

</body>
</html>
