<!DOCTYPE html>
<html>
<head>
<title>Online Food Delivery</title>

<style>
body{
font-family: Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#ff5722;
color:white;
padding:15px;
text-align:center;
}

.menu{
display:flex;
justify-content:center;
gap:20px;
padding:20px;
flex-wrap:wrap;
}

.food{
background:white;
padding:20px;
border-radius:10px;
width:200px;
text-align:center;
box-shadow:0 0 5px gray;
}

.food img{
width:100%;
border-radius:10px;
}

button{
background:#ff5722;
color:white;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#e64a19;
}

footer{
text-align:center;
padding:10px;
background:#333;
color:white;
}
</style>

<script>
function order(food){
alert(food + " added to your order!");
}
</script>

</head>

<body>

<header>
<h1>Online Food Delivery</h1>
<p>Order your favorite food</p>
</header>

<div class="menu">

<div class="food">
<img src="https://images.unsplash.com/photo-1601924582975-7e0f6d8f5c39">
<h3>Pizza</h3>
<p>₹200</p>
<button onclick="order('Pizza')">Order</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<h3>Burger</h3>
<p>₹120</p>
<button onclick="order('Burger')">Order</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1562967916-eb82221dfb36">
<h3>Sandwich</h3>
<p>₹80</p>
<button onclick="order('Sandwich')">Order</button>
</div>

</div>

<footer>
<p>© 2026 Online Food Delivery</p>
</footer>

</body>
</html>
