<!DOCTYPE html>
<html>

<head>
<title>Smart Food Delivery</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1 id="title">Smart Food Delivery</h1>

<input type="text" id="search" placeholder="Search food..." onkeyup="searchFood()">

<select onchange="changeLanguage(this.value)">
<option value="en">English</option>
<option value="ta">Tamil</option>
</select>

<button onclick="getLocation()">📍 Location</button>

</header>


<h2>Popular Foods</h2>

<div class="menu">

<div class="food">
<img src="https://images.unsplash.com/photo-1601924582975-7e0f6d8f5c39">
<h3>Pizza</h3>
<p>₹200</p>
<p>285 kcal</p>
<div class="rating">⭐⭐⭐⭐☆</div>
<button onclick="addToCart('Pizza',200)">Add</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<h3>Burger</h3>
<p>₹120</p>
<p>250 kcal</p>
<div class="rating">⭐⭐⭐⭐⭐</div>
<button onclick="addToCart('Burger',120)">Add</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d">
<h3>Biryani</h3>
<p>₹250</p>
<p>300 kcal</p>
<div class="rating">⭐⭐⭐⭐⭐</div>
<button onclick="addToCart('Biryani',250)">Add</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1562967916-eb82221dfb36">
<h3>Sandwich</h3>
<p>₹80</p>
<p>150 kcal</p>
<div class="rating">⭐⭐⭐⭐</div>
<button onclick="addToCart('Sandwich',80)">Add</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1589308078059-be1415eab4c3">
<h3>Ice Cream</h3>
<p>₹60</p>
<p>210 kcal</p>
<div class="rating">⭐⭐⭐⭐</div>
<button onclick="addToCart('Ice Cream',60)">Add</button>
</div>

<div class="food">
<img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90">
<h3>French Fries</h3>
<p>₹100</p>
<p>300 kcal</p>
<div class="rating">⭐⭐⭐⭐</div>
<button onclick="addToCart('Fries',100)">Add</button>
</div>

</div>


<h2>Your Cart</h2>

<p id="cartItems"></p>

<p>Total Price: ₹ <span id="totalPrice">0</span></p>

<footer>
<p>Smart Food Delivery 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
