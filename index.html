<!DOCTYPE html>
<html>
<head>
<title>Online Food Order</title>
<style>
body{
font-family: Arial;
text-align:center;
background:#f5f5f5;
}

h1{
color:#ff5733;
}

.menu{
display:flex;
justify-content:center;
gap:20px;
}

.item{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 5px gray;
}

button{
background:#ff5733;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Online Food Ordering</h1>

<div class="menu">

<div class="item">
<h3>Pizza</h3>
<p>₹200</p>
<button onclick="order('Pizza')">Order</button>
</div>

<div class="item">
<h3>Burger</h3>
<p>₹120</p>
<button onclick="order('Burger')">Order</button>
</div>

<div class="item">
<h3>Sandwich</h3>
<p>₹80</p>
<button onclick="order('Sandwich')">Order</button>
</div>

</div>

<script>
function order(food){
alert(food + " ordered successfully!");
}
</script>

</body>
</html>
